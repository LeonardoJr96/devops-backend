services:
  #backend:
   # image: leonardojr96/backend-django:latest
  db:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=smysql
    ports:
      - "9696:3306"

  backend-django:
    build: .
    container_name: django-docker
    ports:
     - "8000:8000"
    depends_on:
      - db
    command: sh -c "sleep 1 && python manage.py runserver 0.0.0.0:8000"